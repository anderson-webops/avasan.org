include /etc/nginx/snippets/avasan.org-http-maps.conf;

# Minimal standalone native host for validation. Production keeps its existing
# TLS, dual-stack, HTTP/2, HTTP/3, certificate, and HTTP-to-HTTPS configuration
# and includes avasan.org-server-policy.conf inside that HTTPS server block.
server {
    listen 80;
    listen [::]:80;
    server_name avasan.org www.avasan.org;

    include /etc/nginx/snippets/avasan.org-server-policy.conf;
}
