name: Verify static release artifact

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: avasan-static-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NUXT_TELEMETRY_DISABLED: "1"
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  package-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm

      - name: Pin npm version
        run: npm install --global npm@12.0.2 --allow-scripts=npm

      - name: Verify annotated release identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = v24.18.1
          test "$(npm --version)" = 12.0.2
          test "${GITHUB_REF_NAME}" = "v$(node -p 'require("./package.json").version')"
          test "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" = tag
          test "$(git rev-parse "refs/tags/${GITHUB_REF_NAME}^{commit}")" = "$(git rev-parse HEAD)"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$(git rev-parse HEAD)"

      - name: Install isolated acceptance prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap apparmor nginx
          printf '%s\n' 'abi <abi/4.0>,' 'include <tunables/global>' \
            'profile avasan-artifact-bwrap /usr/bin/bwrap flags=(unconfined) { userns, }' \
            | sudo tee /etc/apparmor.d/avasan-artifact-bwrap >/dev/null
          sudo apparmor_parser -r /etc/apparmor.d/avasan-artifact-bwrap

      - name: Validate exact source
        shell: bash
        run: |
          set -euo pipefail
          npm ci --include=optional --strict-allow-scripts
          npm run audit
          npm run audit:production
          npm run audit:signatures
          npm run verify:dependency-graph
          npm run verify:native-bindings
          npm run lint
          npm run typecheck
          npm test
          python3 -B -m unittest discover -s test -p 'test_verified_static_artifact.py' -v

      - name: Package exact source with historical rollback fixture
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/test-attested-promotion.sh
          printf '\n/.ai-work/\n' >> "$(git rev-parse --git-path info/exclude)"
          mkdir -p .ai-work/runs/tagged-release
          git check-ignore -q .ai-work/runs/tagged-release
          bash scripts/package-static-release.sh .ai-work/runs/tagged-release
          mkdir -p .ai-work/runs/release-assets
          cp .ai-work/runs/tagged-release/*.tar.gz \
            .ai-work/runs/tagged-release/{SHA256SUMS,static-artifact.json,acceptance.json} \
            .ai-work/runs/release-assets/
          test "$(find .ai-work/runs/release-assets -maxdepth 1 -type f | wc -l)" -eq 4

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: accepted-linux-arm64-static-archive
          path: .ai-work/runs/release-assets/
          if-no-files-found: error
          retention-days: 1

  attest-arm64:
    needs: package-arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            deploy/static-artifact.json
            deploy/nginx/http-maps.conf
            deploy/nginx/server-policy.conf

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: accepted-linux-arm64-static-archive
          path: release-assets

      - name: Verify downloaded archive and contract
        id: release
        shell: bash
        run: |
          set -euo pipefail
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 4
          (cd release-assets && sha256sum --check SHA256SUMS)
          archive="$(find release-assets -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          test -n "$archive"
          python3 -B - "$archive" "$GITHUB_SHA" "$GITHUB_REF_NAME" <<'PY'
          import hashlib
          import json
          import sys
          import tarfile
          from pathlib import Path

          archive = Path(sys.argv[1])
          commit, tag = sys.argv[2:]
          manifest = json.loads(Path('release-assets/static-artifact.json').read_text())
          receipt = json.loads(Path('release-assets/acceptance.json').read_text())
          source_contract = json.loads(Path('deploy/static-artifact.json').read_text())
          assert receipt['commit'] == manifest['identity']['revision'] == commit
          assert tag == f"v{manifest['identity']['version']}"
          assert receipt['archive'] == archive.name
          assert receipt['sha256'] == hashlib.sha256(archive.read_bytes()).hexdigest()
          assert receipt['scope'] == 'source-artifact-only'
          assert receipt['hostCapabilitiesVerified'] is False
          assert manifest['contract'] == source_contract
          assert receipt['deploymentContract'] == manifest['contract']['deployment']
          assert manifest['format'] == 1
          assert set(source_contract['required']).issubset(manifest['files'])
          assert set(manifest['adapterFiles']) == set(source_contract['adapterFiles'])
          assert manifest['provenance']['commit'] == commit
          assert manifest['provenance']['tag'] == tag
          assert manifest['provenance']['releaseVerified'] is True
          assert manifest['provenance']['dirty'] is False
          assert all(not any(part.startswith('.') for part in Path(name).parts) for name in manifest['files'])
          expected_files = {'.avasan-static-artifact.json', '.avasan-static-release.json'}
          expected_files.update(f"{source_contract['publicRoot']}/{name}" for name in manifest['files'])
          expected_files.update(source_contract['adapterFiles'])
          with tarfile.open(archive, 'r:gz') as bundle:
              members = bundle.getmembers()
              assert all(member.isdir() or member.isfile() for member in members)
              assert all(not Path(member.name).is_absolute() and '..' not in Path(member.name).parts for member in members)
              files = {member.name: member for member in members if member.isfile()}
              assert len(files) == sum(member.isfile() for member in members)
              assert set(files) == expected_files
              def contents(name):
                  return bundle.extractfile(files[name]).read()
              assert contents('.avasan-static-artifact.json') == Path('release-assets/static-artifact.json').read_bytes()
              assert json.loads(contents('.avasan-static-release.json')) == manifest['provenance']
              assert json.loads(contents(f"{source_contract['publicRoot']}/release.json")) == manifest['identity']
              for name, details in manifest['files'].items():
                  data = contents(f"{source_contract['publicRoot']}/{name}")
                  assert len(data) == details['size']
                  assert hashlib.sha256(data).hexdigest() == details['sha256']
              for name, details in manifest['adapterFiles'].items():
                  data = contents(name)
                  assert data == Path(name).read_bytes()
                  assert len(data) == details['size']
                  assert hashlib.sha256(data).hexdigest() == details['sha256']
          PY
          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"

      - name: Attest exact static archive
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*

      - name: Include provenance in release assets
        run: |
          cp "${{ steps.attest.outputs.bundle-path }}" release-assets/
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 5

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verified-linux-arm64-static-release
          path: release-assets/
          if-no-files-found: error
          retention-days: 30
