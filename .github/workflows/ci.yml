name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NUXT_TELEMETRY_DISABLED: "1"
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm

      - name: Pin npm version
        run: npm install --global npm@12.0.2 --allow-scripts=npm

      - name: Install dependencies
        run: npm ci --include=optional --strict-allow-scripts

      - name: Lint
        run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm

      - name: Pin npm version
        run: npm install --global npm@12.0.2 --allow-scripts=npm

      - name: Install dependencies
        run: npm ci --include=optional --strict-allow-scripts

      - name: Typecheck
        run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm

      - name: Pin npm version
        run: npm install --global npm@12.0.2 --allow-scripts=npm

      - name: Install dependencies
        run: npm ci --include=optional --strict-allow-scripts

      - name: Tests
        run: npm test

  security-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm

      - name: Pin npm version
        run: npm install --global npm@12.0.2 --allow-scripts=npm

      - name: Install dependencies
        run: npm ci --include=optional --strict-allow-scripts

      - name: Full dependency audit
        run: npm run audit

      - name: Production dependency audit
        run: npm run audit:production

      - name: Verify registry signatures
        run: npm run audit:signatures

      - name: Production dependency graph
        run: npm run verify:dependency-graph

      - name: Native lockfile coverage
        run: npm run verify:native-bindings

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm

      - name: Pin npm version
        run: npm install --global npm@12.0.2 --allow-scripts=npm

      - name: Install dependencies
        run: npm ci --include=optional --strict-allow-scripts

      - name: Build and verify static deployment
        run: npm run build

  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm

      - name: Pin npm version
        run: npm install --global npm@12.0.2 --allow-scripts=npm

      - name: Install dependencies
        run: npm ci --include=optional --strict-allow-scripts

      - name: Axe accessibility smoke checks
        run: npm run a11y

  native-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm

      - name: Pin npm version
        run: npm install --global npm@12.0.2 --allow-scripts=npm

      - name: Install ARM64 dependencies
        run: npm ci --include=optional --strict-allow-scripts

      - name: Verify ARM64 native bindings
        run: npm run verify:native-bindings

      - name: Build on ARM64
        run: npm run build

  direct-static-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm

      - name: Pin npm version
        run: npm install --global npm@12.0.2 --allow-scripts=npm

      - name: Install dependencies
        run: npm ci --include=optional --strict-allow-scripts

      - name: Build direct static release
        env:
          AVASAN_RELEASE_REVISION: ${{ github.sha }}
        run: npm run build

      - name: Verify direct deployment assets and scripts
        run: |
          test ! -e Dockerfile
          test ! -e .dockerignore
          test -f front-end/.output/public/index.html
          test -f front-end/.output/public/release.json
          bash -n deploy/direct/prepare-static-release.sh
          bash -n deploy/direct/promote-static-release.sh
          bash -n deploy/direct/verify-release-source.sh
          bash -n deploy/direct/verify-nginx-snippet-dump.sh
          test -x deploy/direct/verify-release-source.sh
          test -x deploy/direct/verify-nginx-snippet-dump.sh

      - name: Syntax-check versioned Nginx policy
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends nginx
          sudo install -m 0644 deploy/nginx/http-maps.conf \
            /etc/nginx/snippets/avasan.org-http-maps.conf
          sudo install -m 0644 deploy/nginx/server-policy.conf \
            /etc/nginx/snippets/avasan.org-server-policy.conf
          sudo install -m 0644 deploy/nginx/default.conf \
            /etc/nginx/conf.d/avasan.org.conf
          sudo nginx -t

      - name: Verify production headers and routing
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          sudo install -d -m 0755 \
            /srv/avasan.org/releases/ci/front-end/.output/public
          sudo cp -a front-end/.output/public/. \
            /srv/avasan.org/releases/ci/front-end/.output/public/
          sudo ln -sfn releases/ci /srv/avasan.org/current
          printf '127.0.0.1 avasan.org\n' | sudo tee -a /etc/hosts >/dev/null
          sudo systemctl restart nginx
          DEPLOYMENT_URL=http://avasan.org npm run smoke:deployment
