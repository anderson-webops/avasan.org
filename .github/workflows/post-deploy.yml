name: Verify production deployment

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Deployed semantic version, such as 1.2.0
        required: true
        type: string
      expected_revision:
        description: Full Git commit SHA embedded in the deployed artifact
        required: true
        type: string

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Stage verified Node for this runner
        run: bash scripts/stage-ci-node.sh

      - name: Prepare independently locked build tools
        run: |
          bin="$(node scripts/build-toolchain.mjs --print-bin)"
          printf '%s\n' "$bin" >> "$GITHUB_PATH"
          "$bin/node" scripts/check-build-toolchain.mjs

      - name: Verify pinned toolchain
        run: |
          test "$(node --version)" = "v26.13.1"
          test "$(npm --version)" = "12.2.3"

      - name: Verify avasan.org production
        env:
          ALLOW_RELEASE_NO_CACHE: "true"
          DEPLOYMENT_URL: https://avasan.org
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: node scripts/static-deployment-smoke.mjs
