name: Verify production deployment

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Deployed semantic version, such as 1.2.0
        required: true
        type: string
      expected_revision:
        description: Full Git commit SHA embedded in the deployed artifact
        required: true
        type: string

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1

      - name: Pin npm version
        run: npm install --global npm@12.0.2 --allow-scripts=npm

      - name: Verify pinned toolchain
        run: |
          test "$(node --version)" = "v24.18.1"
          test "$(npm --version)" = "12.0.2"

      - name: Verify avasan.org production
        env:
          ALLOW_RELEASE_NO_CACHE: "true"
          DEPLOYMENT_URL: https://avasan.org
          EXPECTED_REVISION: ${{ inputs.expected_revision }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: node scripts/static-deployment-smoke.mjs
